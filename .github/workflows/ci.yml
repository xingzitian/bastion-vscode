name: CI

# 扩展这边的单元测试**不需要启动 VS Code**（vscode 模块在测试里打了桩），
# 所以可以在 Linux runner 上秒级跑完 650+ 项，顺便把 vsix 也打出来。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '为已有的 tag 补发/修复 Release（留空则只跑测试；填了会重建这个 tag 的 Release，正文与附件都会被更新）'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 必须是 Node ≥22：npm test 用的是 `node --test "out/test/*.test.js"`（通配符），
      # 而 Node 20 不支持把通配符交给 --test，会直接报
      #   Could not find '...\out\test\*.test.js'
      # 这条是实测出来的（Node 20 下必挂、Node 22/24 下正常）。
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 编译 + 单元测试
        run: npm test

      - name: 版本一致性（tag 必须等于 package.json 的 version）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          pkg="$(node -p "require('./package.json').version")"
          want="${TAG#v}"
          echo "tag=$TAG  package.json=$pkg"
          if [ "$pkg" != "$want" ]; then
            echo "::error::tag 是 $TAG，但 package.json 是 $pkg —— 先改版本再打 tag（否则用户装了会看到错误的版本号）"
            exit 1
          fi

      - name: 打包 vsix（可直接上传商店）
        run: npx --yes @vscode/vsce package --allow-missing-repository --out "bastion-vscode-$(node -p "require('./package.json').version").vsix"

      - name: 上传 vsix
        uses: actions/upload-artifact@v4
        with:
          name: bastion-vscode-vsix
          path: '*.vsix'
          if-no-files-found: error

  # 发布：把打好的 vsix 挂到 GitHub Release 上 —— 用户就能直接下载安装，不用自己打包。
  # 触发方式两种：
  #   1) 推 v* tag（正常流程）
  #   2) 手动 Run workflow 并填 tag（补发历史版本，或**修正文**：已有 Release 会被 edit 覆盖）
  #
  # 发布说明的优先级（从高到低）：
  #   RELEASE-<版本>.md 在仓库里 → 用它（人写过的，最完整）
  #   附注 tag 的注释            → 用它
  #   自动生成的提交记录          → 兜底
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: test
    runs-on: ubuntu-latest
    # 默认 token 是只读的，建 Release 必须显式给写权限；
    # 只加在 release 这个 job 上，构建/测试那两个 job 仍然只读。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要拿到附注 tag 的对象（发布说明可能取自 tag 注释）
          fetch-depth: 0

      - name: 取上一步打好的 vsix
        uses: actions/download-artifact@v4
        with:
          name: bastion-vscode-vsix

      - name: 创建/更新 Release 并附上 vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -e
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          ver="${tag#v}"
          echo "目标 tag：$tag（版本 $ver）"
          ls -lh ./*.vsix

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag 不存在（先在本地 git push origin $tag）"
            exit 1
          fi

          # 发布说明：优先人写过的 RELEASE-<版本>.md
          notes_args=()
          if [ -f "RELEASE-${ver}.md" ]; then
            echo "用 RELEASE-${ver}.md 作为发布说明"
            notes_args=(--notes-file "RELEASE-${ver}.md")
          elif [ "$(git for-each-ref "refs/tags/$tag" --format='%(objecttype)')" = "tag" ]; then
            echo "没有 RELEASE-${ver}.md → 用附注 tag 的说明"
            notes_args=(--notes-from-tag)
          else
            echo "轻量 tag 且没有 RELEASE 文件 → 用自动生成的提交记录"
            notes_args=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "该 tag 已有 Release → 更新正文并覆盖附件"
            gh release edit "$tag" "${notes_args[@]}" --title "$tag"
            gh release upload "$tag" ./*.vsix --clobber
          else
            gh release create "$tag" ./*.vsix --title "$tag" "${notes_args[@]}"
          fi

          echo "完成：$(gh release view "$tag" --json url -q .url)"
